name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Validate JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check functions/config.js
          node --check theme-bootstrap.js

      - name: Run security checks
        run: node security-check.mjs

      - name: Run SEO checks
        run: node seo-check.mjs

      - name: Scan tracked files for private keys
        run: |
          if git grep -n -E -- '-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----'; then
            echo 'Private key material must not be committed.'
            exit 1
          fi

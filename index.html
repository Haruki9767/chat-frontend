<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

 
  <div id="gate-view">
    <h1>Chat</h1>
    <input id="gate-password-input" type="password" placeholder="App password">
    <button id="gate-submit-btn">Continue</button>
    <div id="gate-error"></div>
  </div>

  
  <div id="auth-view" style="display:none">
    <h1>Chat</h1>
    <div id="auth-mode-toggle">
      <button id="auth-login-btn" class="mode-active" type="button">Log In</button>
      <button id="auth-register-btn" type="button">Sign Up</button>
    </div>
    <input id="auth-username-input" type="text" placeholder="Username" autocomplete="username">
    <input id="auth-password-input" type="password" placeholder="Password" autocomplete="current-password">
    <p id="auth-hint" class="hint"></p>
    <button id="auth-submit-btn">Log In</button>
    <div id="auth-error"></div>
  </div>

  
  <div id="room-view" style="display:none">
    <div id="account-bar">
      Logged in as <span id="account-display"></span>
      <button id="logout-btn">Log out</button>
      <button id="delete-account-btn">Delete account</button>
    </div>

    <div id="mode-toggle">
      <button id="mode-join-btn" class="mode-active" type="button">Join Room</button>
      <button id="mode-create-btn" type="button">Create Room</button>
    </div>

    <input id="room-number-input" type="text" inputmode="numeric" placeholder="Room number (e.g. 1254)">
    <input id="room-password-input" type="password" placeholder="Room password">

    <div id="create-only" style="display:none">
      <input id="room-name-input" type="text" placeholder="Room name (label, not unique)">
      <input id="new-room-password-input" type="password" placeholder="Set a room password (required)">
    </div>

    <button id="join-btn">Join</button>
    <button id="create-btn" style="display:none">Create &amp; Join</button>
    <div id="room-error"></div>
  </div>

  <div id="chat-view" style="display:none">
    <header>
      <span>#<span id="room-name-display"></span> <span id="room-number-display"></span></span>
      <span id="user-count">0 users</span>
      <button id="leave-btn">Leave</button>
    </header>

    <div id="message-area"></div>

    <div id="reply-preview" style="display:none">
      <div id="reply-preview-text"></div>
      <button id="reply-cancel-btn" type="button">✕</button>
    </div>

    <div id="input-row">
      <input id="message-input" type="text" placeholder="Message" autocomplete="off" maxlength="2000">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="script.js"></script>
</body>
</html>

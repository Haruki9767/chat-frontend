<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="login-view">
    <h1>Chat</h1>
    <input id="app-password-input" type="password" placeholder="App password">

    <div class="mode-toggle">
      <button id="join-mode-btn" class="active">Join Room</button>
      <button id="create-mode-btn">Create Room</button>
    </div>

    <input id="username-input" type="text" placeholder="Username">
    <input id="room-input" type="text" placeholder="Room name">

    <!-- Room password field (used for both join & create) -->
    <input id="room-password-input" type="password" placeholder="Room password (optional)">

    <!-- Extra field for "Create Room" (e.g., confirm password, description) -->
    <div id="create-room-extra" style="display:none;">
      <input id="room-description-input" type="text" placeholder="Description (optional)">
      <!-- You can add more fields if needed -->
    </div>

    <button id="join-btn">Join / Create</button>
    <div id="login-error"></div>
  </div>

  <div id="chat-view" style="display:none">
    <!-- same as before -->
  </div>

  <script src="/config.js"></script>
  <script src="script.js"></script>
</body>
</html>

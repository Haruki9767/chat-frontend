<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="login-view">
    <h1>Chat</h1>
    <input id="app-password-input" type="password" placeholder="App password">

    <div class="mode-toggle">
      <button id="join-mode-btn" class="active">Join Room</button>
      <button id="create-mode-btn">Create Room</button>
    </div>

    <input id="username-input" type="text" placeholder="Username">
    <input id="room-input" type="text" placeholder="Room name">
    <input id="room-password-input" type="password" placeholder="Room password (optional)">

    <div id="create-room-extra" style="display:none;">
      <input id="room-description-input" type="text" placeholder="Description (optional)">
    </div>

    <button id="join-btn">Join Room</button>
    <div id="login-error"></div>
  </div>

  <div id="chat-view" style="display:none">
    <header>
      <span>#<span id="room-name-display"></span></span>
      <span id="user-count">0 users</span>
      <button id="leave-btn">Leave</button>
    </header>

    <div id="message-area"></div>

    <div id="input-row">
      <input id="message-input" type="text" placeholder="Message" autocomplete="off">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="script.js"></script>
</body>
</html>

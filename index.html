<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">
    <!-- Login / Room Selection -->
    <div id="login-view">
      <h1>Chat</h1>
      <div class="login-form">
        <input type="text" id="username-input" placeholder="Your name" />
        <input type="text" id="room-input" placeholder="Room name" value="general" />
        <button id="join-btn">Join Chat</button>
      </div>
    </div>

    <!-- Chat View -->
    <div id="chat-view" style="display: none;">
      <div id="chat-header">
        <span id="room-name-display">general</span>
        <span id="user-count">0 users</span>
        <button id="leave-btn">Leave</button>
      </div>
      <div id="message-area"></div>
      <div id="input-area">
        <input type="text" id="message-input" placeholder="Type a message..." />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <!-- Environment variable injection -->
  <script>
    // This will be replaced by Cloudflare Pages
    window.BACKEND_URL = '{{BACKEND_URL}}';
  </script>
  <script src="script.js"></script>
</body>
</html>
